name: CI
on:
  push:
    branches:
      - master
  pull_request:

# `.cargo/config.toml` sets `-C target-cpu=native` for local release
# builds. That flag occasionally trips a clippy SIGILL on GitHub
# runners and produces output we'd never ship anyway (CI only runs
# the compiled artefacts inside the workflow). `RUSTFLAGS=""` replaces
# the config.toml rustflags outright.
env:
  RUSTFLAGS: ""

jobs:
  rustfmt:
    name: Check Style
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: Run Clippy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Run cargo clippy
        run: cargo clippy --workspace --features tools -- -D warnings

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Run cargo test
        run: cargo test --workspace --features tools

  external-validators:
    name: External COPC Validators
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Install PDAL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pdal
      - name: Build release binary
        run: cargo build --release
      - name: Check converted fixtures with PDAL and copc-validator
        run: scripts/ci/external-validators.sh

  memory-limits:
    name: Memory Limits
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Install PDAL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pdal
      - name: Build release binary
        run: cargo build --release
      # Both steps share WORK so the synthetic inputs are generated once.
      # (`runner` isn't available in job-level env, only in steps.)
      - name: Stay within container memory limits
        run: scripts/ci/memory-limits.sh gating
        env:
          WORK: ${{ runner.temp }}/memtest
      - name: Known memory issues (report only)
        run: scripts/ci/memory-limits.sh known-issues
        env:
          WORK: ${{ runner.temp }}/memtest
