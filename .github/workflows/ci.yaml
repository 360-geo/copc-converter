name: CI
on:
  push:
    branches:
      - master
  pull_request:

# `.cargo/config.toml` sets `-C target-cpu=native` for local release
# builds. That flag occasionally trips a clippy SIGILL on GitHub
# runners and produces output we'd never ship anyway (CI only runs
# the compiled artefacts inside the workflow). `RUSTFLAGS=""` replaces
# the config.toml rustflags outright.
env:
  RUSTFLAGS: ""

jobs:
  rustfmt:
    name: Check Style
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: Run Clippy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Run cargo clippy
        run: cargo clippy --workspace --features tools -- -D warnings

  # Release binaries are also built for macOS and Windows, whose
  # platform-specific code (e.g. memory detection) Linux never compiles.
  # Lint it here rather than discovering breakage at release time. Default
  # features only, as release builds use.
  clippy-release-platforms:
    name: Run Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Run cargo test
        run: cargo test --workspace --features tools

  external-validators:
    name: External COPC Validators
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      # Ubuntu 24.04 doesn't package PDAL; take it from conda-forge.
      - name: Install PDAL
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: pdal
          create-args: pdal
          init-shell: bash
          cache-environment: true
      - name: Build release binary
        run: cargo build --release
      - name: Check converted fixtures with PDAL and copc-validator
        shell: bash -el {0}
        run: scripts/ci/external-validators.sh

  memory-limits:
    name: Memory Limits
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      # Ubuntu 24.04 doesn't package PDAL; take it from conda-forge.
      - name: Install PDAL
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: pdal
          create-args: pdal
          init-shell: bash
          cache-environment: true
      - name: Build release binary and test-data tools
        run: cargo build --release --bins --examples
      # Both steps share WORK so the synthetic inputs are generated once.
      # (`runner` isn't available in job-level env, only in steps.)
      - name: Stay within container memory limits
        shell: bash -el {0}
        run: scripts/ci/memory-limits.sh gating
        env:
          WORK: ${{ runner.temp }}/memtest
      - name: Known memory issues (report only)
        shell: bash -el {0}
        run: scripts/ci/memory-limits.sh known-issues
        env:
          WORK: ${{ runner.temp }}/memtest
